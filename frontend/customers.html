<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers - MiniShop</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="topbar">
      <div class="brand">MiniShop</div>
      <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/products">Products</a>
        <a href="/customers">Customers</a>
        <a href="/sales">Sales</a>
        <a href="/invoices">Invoices</a>
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
      </div>
    </nav>

    <main class="page-container">
      <h2>Customer Management</h2>

      <div class="card form-card">
        <h3>Add / Update Customer</h3>
        <form id="customerForm">
          <input type="hidden" id="customerId" />
          <div class="form-row">
            <div class="form-group">
              <label>Name</label>
              <input type="text" id="customerName" required />
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="text" id="customerPhone" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="customerEmail" />
            </div>
            <div class="form-group">
              <label>Address</label>
              <input type="text" id="customerAddress" />
            </div>
          </div>
          <div class="button-row">
            <button type="submit" class="btn btn-primary">Save Customer</button>
            <button type="button" id="resetCustomerForm" class="btn btn-secondary">Reset</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h3>Customer List</h3>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Phone</th>
              <th>Email</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="customersTableBody"></tbody>
        </table>
      </div>
    </main>

    <script src="/js/customers.js"></script>
  </body>
</html>
