<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales - MiniShop</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <nav class="topbar">
      <div class="brand">MiniShop</div>
      <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/products">Products</a>
        <a href="/customers">Customers</a>
        <a href="/sales">Sales</a>
        <a href="/invoices">Invoices</a>
        <button id="logoutBtn" class="btn btn-secondary">Logout</button>
      </div>
    </nav>

    <main class="page-container">
      <h2>Create Sale</h2>

      <div class="card form-card">
        <form id="saleForm">
          <div class="form-row">
            <div class="form-group">
              <label>Customer</label>
              <select id="saleCustomer" required></select>
            </div>
            <div class="form-group">
              <label>Payment Method</label>
              <select id="paymentMethod">
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="UPI">UPI</option>
              </select>
            </div>
          </div>

          <div class="card inner-card">
            <h3>Add Products</h3>
            <div class="form-row">
              <div class="form-group">
                <label>Product</label>
                <select id="productSelect"></select>
              </div>
              <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="productQty" min="1" value="1" />
              </div>
              <div class="form-group button-inline">
                <button type="button" id="addItemBtn" class="btn btn-primary">Add Item</button>
              </div>
            </div>
          </div>

          <div class="card inner-card">
            <h3>Sale Items</h3>
            <table>
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Qty</th>
                  <th>Price</th>
                  <th>Total</th>
                  <th>Remove</th>
                </tr>
              </thead>
              <tbody id="saleItemsBody"></tbody>
            </table>
          </div>

          <div class="summary-box">
            <div><span>Subtotal</span><strong id="subtotalValue">₹0</strong></div>
            <div><span>Discount</span><input type="number" id="discountValue" value="0" min="0" step="0.01" /></div>
            <div><span>Tax</span><input type="number" id="taxValue" value="0" min="0" step="0.01" /></div>
            <div class="grand-total"><span>Total</span><strong id="totalValue">₹0</strong></div>
          </div>

          <button type="submit" class="btn btn-primary">Complete Sale</button>
        </form>
      </div>
    </main>

    <script src="/js/sales.js"></script>
  </body>
</html>
