<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniShop Login</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <h1>MiniShop</h1>
      <p>Product Sales & Inventory Management</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="admin@minishop.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="admin123" required />
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <div class="hint-box">
        Demo admin:<br />
        Email: admin@minishop.com<br />
        Password: admin123
      </div>
    </div>

    <script src="/js/auth.js"></script>
  </body>
</html>
